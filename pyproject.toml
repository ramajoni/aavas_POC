[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aavas-agentic-pricing"
version = "0.1.0"
description = "Two-stage home-loan pricing, yield optimization and sales-override intelligence (POC)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
full = ["xgboost>=2.0", "shap>=0.46", "optuna>=3.6", "mlflow>=2.12"]
# AI-written loan explanations (POST /pricing/explain/{decision_id}/narrative).
llm = ["anthropic>=1.0"]
# The learner catalogue. Without these, `make verify-algorithms` reports them
# unavailable with the install line - and `smote`/`adasyn` fall back to random
# oversampling under a renamed strategy rather than silently.
learners = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2",
            "imbalanced-learn>=0.12", "interpret-core>=0.6"]
federated = ["flwr>=1.8"]
dev = ["pytest>=8.0"]

[project.scripts]
aavas-generate = "aavas.synthetic.generator:main"
aavas-train = "aavas.models.train_all:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
