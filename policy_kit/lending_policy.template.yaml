housing_regulatory_ltv:
  - max_amount: "<integer>"
    max_ltv: "<number: fraction 0-1>"
    else: "<true|false>"

# Effective LTV rule
#   Purpose:     The formula that picks the LTV actually allowed, usually the
#                lowest of the grade, regulatory and collateral ceilings.
