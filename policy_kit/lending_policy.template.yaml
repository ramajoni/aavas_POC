# Eligibility limits by grade
#   Purpose:     Maximum FOIR, minimum DSCR and maximum LTV for each grade. A
#                grade with no offer is null.
#   Requirement: optional
#   Owner:       credit policy
#   Keys:        the company's own names
eligibility_limits:
  "<your name 1>":
    foir_max: "<number: fraction 0-1>"
    dscr_min: "<number>"
    hl_ltv_max: "<number: fraction 0-1>"
    lap_res_ltv_max: "<number: fraction 0-1>"
