# Lending pricing policy: blank template.
#
# Generated by scripts/policy_kit.py build from the common structure. Do not hand-edit
# the structure; copy this file, then fill in the copy.
#
# How to fill it in
#   1. Replace every "<...>" placeholder with the company's own value.
#   2. Where a section says keys are the company's own names, replace the two examples
#      with the company's real names (grade labels, segments, property types and so on).
#   3. Delete an optional section only if the company does not use it.
#   4. Rates are annual percentages (13.00 means 13% p.a.). Spreads are in basis points.
#   5. Check the result: python scripts/policy_kit.py validate <your file>
#
# This file is not valid until every placeholder is filled in.

# ============================================================================
# PART A: IDENTITY AND GOVERNANCE
# Which policy this is, which one it replaces, and what has been decided about
# it.
# ============================================================================

# Policy version
#   Purpose:     The unique name of this policy file. Every decision records it,
#                so a reviewer can read the policy a decision was priced under.
#   Requirement: required
#   Owner:       compliance
policy_version: "<text: unique policy id, for example XX-POLICY-2026.01>"

# Policy it replaces
#   Purpose:     The policy_version this file replaces. Leave it null for the
#                first policy.
#   Requirement: optional
#   Owner:       compliance
supersedes: "<text: policy_version this file replaces, or null>"

# Draft it was based on
#   Purpose:     The version of the circulated draft this file was aligned to,
#                if any.
#   Requirement: optional
#   Owner:       compliance
based_on_draft_of: "<text: draft version, or null>"

# Approval status
#   Purpose:     Where the policy stands, for example draft pending approval or
#                approved. Shown on the policy screen.
#   Requirement: optional
#   Owner:       compliance
status: "<text>"

# Default product
#   Purpose:     The single product key kept for older code that expects one
#                product.
#   Requirement: optional
#   Owner:       credit policy
product: "<text>"

# Products covered
#   Purpose:     The loan products this policy covers.
#   Requirement: optional
#   Owner:       credit policy
products:
  - "<text>"

# Effective date
#   Purpose:     The date the policy takes effect, as YYYY-MM-DD. Set it on
#                approval.
#   Requirement: optional
#   Owner:       compliance
effective_from: "<date: YYYY-MM-DD>"

# Decisions log
#   Purpose:     A numbered log of decisions taken on open items in the draft,
#                each with its reason. It is the audit trail for why a value is
#                what it is.
#   Requirement: optional
#   Owner:       credit policy
#   Keys:        the company's own names
decisions:
  "<your name 1>": "<text>"
  "<your name 2>": "<text>"

# ============================================================================
# PART B: PRICING
# How a rate is built from a reference rate, grade, tenure and loadings, and how
# an offer is searched.
# ============================================================================

# Pricing method
#   Purpose:     Names how the final rate is built, for example grade base rate
#                plus tenure adjustment.
#   Requirement: optional
#   Owner:       pricing
pricing_method: "<text>"

# Reference rates
#   Purpose:     The reference lending rate and the card rate floor and ceiling.
#                Every offer must sit between the floor and the ceiling.
#   Requirement: required
#   Owner:       pricing
reference:
  plr: "<number: % p.a.>"
  card_rate_floor: "<number: % p.a.>"
  card_rate_ceiling: "<number: % p.a.>"

# Unit economics
#   Purpose:     Funding, servicing, acquisition and capital costs, the
#                processing fee and the discount rate. Used to value an offer.
#   Requirement: required
#   Owner:       pricing
economics:
  funding_cost_pct: "<number: %>"
  servicing_cost_pct: "<number: %>"
  acquisition_cost_pct: "<number: %>"
  processing_fee_pct: "<number: %>"
  capital_charge_pct: "<number: %>"
  discount_rate_pct: "<number: % p.a.>"
  behavioural_horizon_years: "<integer: years>"

# Base spread by segment
#   Purpose:     The starting spread, in basis points, for each borrower
#                segment.
#   Requirement: required
#   Owner:       pricing
#   Keys:        the company's own names
base_spread_bps:
  "<your name 1>": "<integer: bps>"
  "<your name 2>": "<integer: bps>"

# Risk grade loading
#   Purpose:     The spread added over the card rate floor for each risk grade.
#                A grade with no offer is null.
#   Requirement: required
#   Owner:       pricing
#   Keys:        the company's own names
risk_grade_loading_bps:
  "<your name 1>": "<integer: bps, or null>"
  "<your name 2>": "<integer: bps, or null>"

# LTV loading
#   Purpose:     Spread added by loan-to-value band. Use zero where LTV is
#                already scored.
#   Requirement: required
#   Owner:       pricing
ltv_loading_bps:
  - max_ltv: "<number: fraction 0-1>"
    bps: "<integer: bps>"

# Property type loading
#   Purpose:     Spread added by property or construction type.
#   Requirement: required
#   Owner:       pricing
#   Keys:        the company's own names
property_type_loading_bps:
  "<your name 1>": "<integer: bps>"
  "<your name 2>": "<integer: bps>"

# Tenure loading
#   Purpose:     Spread added by tenure band. It must agree with the tenure
#                adjustment in the pricing section.
#   Requirement: required
#   Owner:       pricing
tenure_loading_bps:
  - max_months: "<integer: months>"
    bps: "<integer: bps>"

# Deviation loading
#   Purpose:     Spread added per recorded deviation, and its cap.
#   Requirement: required
#   Owner:       pricing
deviation_loading_bps:
  per_deviation: "<integer>"
  max_total: "<integer>"

# Pricing matrix
#   Purpose:     The rate band, the base rate per grade, the tenure adjustments
#                and the final rate matrix of grade by tenure band. The matrix
#                rate is the most an offer may carry.
#   Requirement: required
#   Owner:       pricing
pricing:
  basis: "<text>"
  roi_floor: "<number: % p.a.>"
  roi_ceiling: "<number: % p.a.>"
  grade_base_roi:  # keys are the company's own names
    "<your name 1>": "<number: % p.a., or null>"
    "<your name 2>": "<number: % p.a., or null>"
  tenure_adjustment:
    - min_months: "<integer: months>"
      max_months: "<integer: months>"
      add_pct: "<number: % p.a.>"
  matrix:  # keys are the company's own names
    "<your name 1>":
      - "<number: % p.a., or null>"
    "<your name 2>":
      - "<number: % p.a., or null>"
  d_grade_cannot_buy_eligibility: "<true|false>"
  stress_test_add_pct: "<number: %>"

# Indicative quote band
#   Purpose:     How the indicative rate band shown before full assessment is
#                sized, rounded and capped.
#   Requirement: required
#   Owner:       pricing
stage1:
  quantile_low: "<number: fraction 0-1>"
  quantile_high: "<number: fraction 0-1>"
  min_band_width_bps: "<integer: bps>"
  max_band_width_bps: "<integer: bps>"
  round_to_bps: "<integer: bps>"
  eligibility_foir_cap: "<number: fraction 0-1>"
  quote_band_floor: "<number: % p.a.>"
  quote_band_ceiling: "<number: % p.a.>"

# Offer optimiser
#   Purpose:     How the engine searches for the best offer inside the permitted
#                band, and the conversion and balance-transfer limits it
#                respects.
#   Requirement: required
#   Owner:       pricing
optimizer:
  step_bps: "<integer: bps>"
  search_space: "<text>"
  permissible_band_source: "<text>"
  honour_indicative_band: "<true|false>"
  stage2_interval_sigmas: "<number>"
  min_conversion_probability: "<number: fraction 0-1>"
  max_bt_out_probability: "<number: fraction 0-1>"
  ev_tolerance_pct: "<number: %>"
  candidate_tenures_months:
    - "<integer: months>"
  recalc_dependent_parameters:
    - "<text>"
  unresolved_calc_loop: "<text>"
  freeze_initial_ltv_for_scoring: "<true|false>"

# ============================================================================
# PART C: CREDIT AND ELIGIBILITY
# Hard limits, scorecards, grades, affordability and the rules that stop a file.
# ============================================================================

# Hard limits
#   Purpose:     The loan-level limits no offer may break, such as maximum LTV,
#                FOIR, tenure, amount, minimum score and the deepest discount.
#   Requirement: required
#   Owner:       credit policy
constraints:
  max_ltv: "<number: fraction 0-1>"
  max_foir: "<number: fraction 0-1>"
  min_tenure_months: "<integer: months>"
  max_tenure_months: "<integer: months>"
  max_tenure_years: "<integer: years>"
  min_credit_score: "<integer>"
  new_to_credit_allowed: "<true|false>"
  new_to_credit_min_spread_bps: "<integer: bps>"
  max_loan_amount: "<integer>"
  absolute_discount_floor_bps: "<integer: bps>"
  min_age_years: "<integer: years>"
  max_age_at_maturity:  # keys are the company's own names
    "<your name 1>": "<integer>"
    "<your name 2>": "<integer>"

# Scorecard models
#   Purpose:     The scorecard models the company runs, with a short description
#                and the weight of each scorecard category in each model.
#   Requirement: required
#   Owner:       risk
#   Keys:        the company's own names
models:
  "<your name 1>":
    description: "<text>"
    category_weights:  # keys are the company's own names
      "<your name 1>": "<number: weight, 0-100>"
      "<your name 2>": "<number: weight, 0-100>"
  "<your name 2>":
    description: "<text>"
    category_weights:  # keys are the company's own names
      "<your name 1>": "<number: weight, 0-100>"
      "<your name 2>": "<number: weight, 0-100>"

# Required model variants
#   Purpose:     The model variants that must exist before a file can be auto-
#                sanctioned. Missing evidence means a hold, not a re-weighting.
#   Requirement: optional
#   Owner:       risk
model_variants_required:
  - "<text>"

