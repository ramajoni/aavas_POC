# Sub-scores
#   Purpose:     Sub-scores for employer, industry and builder quality, with
#                factor weights that sum to 100.
#   Requirement: required
#   Owner:       risk
subscores:
  employer:
    factors:
      payroll_punctuality_6m:
        weight: "<number: weight, 0-100>"
        bands:
          - le: "<integer>"
            score: "<number: score, 0-100>"
            else: "<true|false>"
            action: "<text>"
      operating_continuity_years:
        weight: "<number: weight, 0-100>"
        bands:
          - ge: "<integer>"
            score: "<number: score, 0-100>"
            else: "<true|false>"
            action: "<text>"
      financial_resilience:
        weight: "<number: weight, 0-100>"
        categories:
          verified_stable: "<integer>"
          moderate_stress: "<integer>"
          severe_unresolved_stress:
            score: "<number: score, 0-100>"
            action: "<text>"
          missing_evidence: "<text>"
      portfolio_concentration:
        weight: "<number: weight, 0-100>"
        bands:
          - le: "<number>"
            score: "<number: score, 0-100>"
            else: "<true|false>"
            action: "<text>"
    inconclusive_mandatory_factor: "<text>"
  industry:
    factors:
      demand_cyclicality: "<integer>"
      regulation_licences: "<integer>"
      margins_cash_conversion: "<integer>"
      counterparty_dependence: "<integer>"
      commodity_fx_climate: "<integer>"
    assumptions_dated_and_approved_by: "<text>"
  builder:
    applies_to:
      - "<text>"
    factors:
      delivery_performance:
        weight: "<number: weight, 0-100>"
        definition: "<text>"
        bands:
          - ge: "<number>"
            score: "<number: score, 0-100>"
            else: "<true|false>"
      funding_coverage:
        weight: "<number: weight, 0-100>"
        bands:
          - ge: "<number>"
            score: "<number: score, 0-100>"
            else: "<true|false>"
            action: "<text>"
      dispute_impact:
        weight: "<number: weight, 0-100>"
        categories:
          none: "<integer>"
          manageable: "<integer>"
          material_unresolved:
            score: "<number: score, 0-100>"
            action: "<text>"
      disclosure_quality:
        weight: "<number: weight, 0-100>"
        categories:
          complete: "<integer>"
          minor_curable_gaps: "<integer>"
          material_gaps:
            score: "<number: score, 0-100>"
            action: "<text>"
      schedule_variance_months:
        weight: "<number: weight, 0-100>"
        bands:
          - le: "<integer>"
            score: "<number: score, 0-100>"
            action: "<text>"
            else: "<true|false>"
    outcome_bands:
      - ge: "<integer>"
        outcome: "<text>"
        else: "<true|false>"
    never_increases:
      - "<text>"

# Grade bands
#   Purpose:     How the application score maps to a grade and a decision, the
