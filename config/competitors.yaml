# ------------------------------------------------------- unrecognised lenders
# A capitalised name followed by one of these is lender-shaped. If the registry
# does not know it, it is reported for review (and only fuzzy-matched when the
# name is a near-spelling of a registry name, never "closest wins").
lender_suffixes: ["Housing Finance", "Home Finance", "Housing Development Finance",
                  "Home Loans", "Home Loan", "Housing", "HFC", "HFL", "HF", "Finance",
                  "Financiers", "Finserv", "Fincorp", "FinCorp", "Capital",
                  "Small Finance Bank", "SFB", "Co-operative Bank", "Cooperative Bank",
                  "Sahakari Bank", "Bank"]
# Leading words that make a lender-shaped phrase generic rather than a name.
generic_heads: ["the", "a", "an", "our", "their", "his", "her", "local", "another", "other",
                "some", "any", "this", "that", "same", "private", "govt", "government",
                "public", "customer", "customers", "branch", "co-operative", "cooperative",
                "nationalised", "nationalized", "psu", "housing", "home", "bank", "finance",
                "loan", "loans", "rural", "urban", "small", "big", "new", "old", "existing",
                "previous", "current", "also", "with", "from", "and", "or", "of", "to", "in",
                "at", "for", "by", "via", "hfc", "nbfc", "his", "pvt", "ltd", "rate",
                "competitor", "competing", "rival", "approved", "builder", "project",
                "sanction", "offer", "letter", "quote", "copy", "whatsapp", "verbal", "says",
                "claims", "mentioned", "showed", "forwarded", "called", "comparing", "losing",
                "files", "shared", "walk-in", "dsa-sourced", "connector", "online", "lead",
                "enquiry", "salaried", "self-employed", "aware", "rbi", "nhb", "cibil"]
fuzzy:
  # difflib ratios. A bare word must reach min_ratio against a registry name
  # ("Shubam" vs "Shubham" = 0.92). A lender-shaped phrase must reach min_ratio
  # as a whole and min_head_ratio on its name part, so "Muthoot Fincorp" (same
  # group, different lender) is not folded into "Muthoot HF". Below either, the
  # name is unrecognised and goes to review - it is never guessed.
  min_ratio: 0.86
  min_head_ratio: 0.80
  min_length: 5

# --------------------------------------------------------------- extraction cues
# Evidence is classified per mention from the words around it. Explicit negation
# wins over a document cue ("no document shared"), and a document cue wins over
# plain hearsay ("customer says" next to "sanction letter").
evidence_cues:
  undocumented:
    ["no document", "no documents", "no doc", "not verified", "unverified", "not shared",
     "yet to share", "will share", "awaited", "without document", "without any document",
     "no proof", "no letter", "no copy", "not on file", "verbal", "verbally", "whatsapp",
     "screenshot", "claims", "claimed", "called with", "over phone", "on phone", "on call"]
  documented:
    ["sanction letter", "offer letter", "sanction copy", "sanction mail", "letter on file",
     "on file", "letter shared", "copy shared", "written quote", "quote letter",
     "documented", "in writing"]
  hearsay:
    ["as per customer", "per customer", "customer says", "says", "said", "mentioned",
     "bol raha", "bol rahi", "bata raha", "bata rahi", "keh raha", "heard", "told"]

# An `ambiguous` alias counts only in a sentence carrying a rate or one of these.
lending_context_cues: ["quote", "quoted", "offer", "offering", "offered", "sanction", "loan", "roi",
                       "interest", "rate", "bt ", "balance transfer", "comparing", "compare",
                       "lender", "files", "aggressive", "de raha", "de rahi", "karayega",
                       "pricing", "takeover", "switch"]

# A rate whose lead-in carries one of these is the customer's own ask, not a quote.
customer_ask_cues: ["wants", "want ", "wanted", "firm on", "expects", "expecting", "expectation",
                    "asking for", "asked for", "asks for", "looking for", "target rate",
                    "will not sign above", "won't sign above", "will sign at", "will close at",
                    "chahiye", "budget", "ready at", "ready to sign at", "insisting on",
                    "stays above", "goes above", "if our rate is above", "only if below"]
# ...and one of these marks our own rate.
our_rate_cues: ["our rate", "our offer", "our roi", "our card", "we offered", "we quoted",
                "we can", "we sanctioned", "offered by us", "from us", "retain", "retaining",
                "recommended", "card rate", "our pricing", "our final"]

# ------------------------------------------------------------- analysis
analysis:
  # Cells with fewer observations than this are suppressed, not shown as noise.
  min_n_cell: 20
  min_n_rate: 30          # a win rate or override rate needs more than a median does
  min_n_benchmark: 15     # per-loan city benchmark
  # Gap = competitor quote - our sanctioned rate, in bps. Negative = they undercut us.
  gap_buckets_bps: [-75, -50, -25, 0, 25]
  plausibility_percentile: 5
  comparable_negotiations: 3
