# Competitor registry - who Aavas competes with, and how branches write their names
#
# Written from knowledge of the Indian housing-finance market (Rajasthan, Gujarat,
# MP, Maharashtra, UP affordable housing), not from the synthetic generator: the
# extraction quality report scores this registry against the notes' latent truth,
# and copying the generator's spellings would turn that score into a tautology.
#
# Three rules:
#   1. An alias maps to exactly one canonical lender. Misspellings are NOT listed
#      here - a bounded fuzzy match (below) catches them and says it did.
#   2. A bare word that is also a common Indian name or an everyday document
#      ("Shubham", "Aadhaar", "LIC", "Bajaj") is `ambiguous`: it counts only in a
#      sentence that is about lending, and never next to its non-lender sense
#      ("Aadhaar card", "LIC policy").
#   3. A lender-like name the registry does not know ("Xyz Housing Finance") is
#      surfaced as UNRECOGNISED FOR REVIEW. It is never mapped to the nearest
#      known name - that would silently merge two lenders' quotes.
#
# The canonical names used in the structured application data (HDFC, LIC HF,
# Bajaj HF, Local Bank, Shubham HF, Aadhar HF) must stay canonical here: the
# historical analysis joins on them.

competitors_config_version: "COMP-2026.10"

# Ourselves. A rate next to one of these is our rate, never a competitor quote.
self_names: ["Aavas", "Aavas Financiers", "Aavas Housing", "Aavas HF", "Aavas Home Loans"]

lenders:
  # ------------------------------------------------ structured-data canonicals
  HDFC:
    type: bank
    note: "HDFC Ltd merged into HDFC Bank (July 2023); branches still write both"
    aliases: ["HDFC", "HDFC Bank", "HDFC Ltd", "HDFC Limited", "HDFC Home Loans",
              "HDFC Home Loan", "HDFC Housing", "HDFC Housing Finance", "HDFC HL"]
  LIC HF:
    type: HFC
    aliases: ["LIC Housing Finance", "LIC Housing", "LIC HF", "LIC HFL", "LICHFL", "LICHF",
              "LIC Home Loans", "LIC Home Loan", "LIC Housing Finance Ltd"]
    ambiguous: ["LIC"]
    not_when_followed_by: ["policy", "policies", "premium", "insurance", "agent", "maturity",
                           "surrender", "jeevan", "bond"]
  Bajaj HF:
    type: HFC
    aliases: ["Bajaj Housing Finance", "Bajaj Housing", "Bajaj HF", "Bajaj HFL", "BHFL",
              "Bajaj Finserv", "Bajaj Finserv Home Loan", "Bajaj Finserv Home Loans",
              "Bajaj Finance"]
    ambiguous: ["Bajaj"]
    not_when_followed_by: ["auto", "electricals", "allianz", "emi card", "card"]
  Aadhar HF:
    type: HFC
    aliases: ["Aadhar Housing Finance", "Aadhar Housing", "Aadhar HF", "Aadhar HFL",
              "Aadhaar Housing Finance", "Aadhaar Housing", "Aadhaar HF", "AHFL"]
    ambiguous: ["Aadhar", "Aadhaar"]
    not_when_followed_by: ["card", "number", "no", "kyc", "ekyc", "e-kyc", "linked", "seeding",
                           "otp", "copy", "based", "address", "authentication", "enrolment"]
  Shubham HF:
    type: HFC
    aliases: ["Shubham Housing Finance", "Shubham Housing Development Finance",
              "Shubham Housing", "Shubham HF", "Shubham HFL", "SHDFC"]
    ambiguous: ["Shubham"]
  Local Bank:
    type: co-operative
    note: >-
      The structured field's catch-all for a bank the customer did not name: a local
      co-operative, urban or gramin bank, or an unnamed public-sector bank. A named
      bank (SBI, PNB, Bank of Baroda...) is its own lender, never this one.
    aliases: ["local bank", "co-operative bank", "cooperative bank", "co-op bank", "coop bank",
              "urban co-operative bank", "urban cooperative bank", "sahakari bank",
              "nagarik sahakari bank", "gramin bank", "regional rural bank",
              "nationalised bank", "nationalized bank", "PSU bank", "public sector bank",
              "government bank", "govt bank", "sarkari bank"]

  # ---------------------------------------------------------- other banks
  SBI:
    type: bank
    aliases: ["SBI", "State Bank", "State Bank of India", "SBI Home Loans", "SBI Home Loan",
              "SBI HL"]
