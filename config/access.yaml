# Sign-in and role-based access.
#
# Who can sign in, what each role sees in the browser, and which API routes each
# role may call. Re-read whenever this file changes: removing a user or narrowing
# a role takes effect at the next request, not the next restart.
#
# Only enforced when AAVAS_AUTH_MODE=session (the default). Passwords are
# PBKDF2-SHA256 hashes; make a new one with `python -m aavas.api.access`. These
# are synthetic personas for the POC; production replaces the users table with
# SSO and roles from the directory.
version: ACCESS-2026.10

# Borrowers may create their own account from the sign-in screen. Such accounts
# are stored in the database and can only ever be borrowers.
registration:
  borrowers: true

session:
  ttl_minutes: 480          # a working day
  max_failed_logins: 5      # per username, then locked for lockout_minutes
  lockout_minutes: 5

# --------------------------------------------------------------------- roles
# pages:     the lending-workspace pages the role may open (the browser hides the
#            rest; the API rules below are what actually enforce access).
# landing:   where the role lands after sign-in.
# console:   may open the Agentic Credit Pricing OS console (/os.html).
# rate_authority: the approval_authority level from pricing_policy.yaml that this
#            role's rate decisions are recorded under.
# offer_below_recommendation_bps: how far below the system recommendation this role may
#            send an offer itself, with a reason; lower needs the next role up.
# approve_below_recommendation_bps: how far below the recommendation this role may
#            approve a requested rate; lower goes to the credit head.
roles:
  borrower:
    label: "Borrower"
    landing: offer
    pages: [offer]
  relationship_manager:
    label: "Relationship manager"
    landing: applications
    pages: [applications, new-application, application, policy]
    rate_authority: sales_officer
    # Matches pricing_policy.yaml override.max_unevidenced_discount_bps.
    offer_below_recommendation_bps: 15
    # Disbursement target a month, per RM (a user may set monthly_target_inr).
    monthly_disbursement_target_inr: 20000000
  area_manager:
    label: "Area manager"
    landing: approvals
    pages: [approvals, disbursements, application, dashboard, learning, audit, policy, competitors]
    rate_authority: regional_manager
    approve_below_recommendation_bps: 40
  model_validation:
    label: "Risk and model validation"
    landing: models
    console: true
    pages: [models, xai, credit-score, xai-dash, mlflow, features, runtime, record,
            governance, control-tower, agents, learning, learning-proof, audit, policy, config]
  administrator:
    label: "Platform administrator"
    landing: dashboard
    console: true
    all_pages: true
    all_routes: true

