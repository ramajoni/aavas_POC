# -------------------------------------------------------------- open routes
# No sign-in needed. Health carries versions and counts, no customer data.
public:
  - {path: /, exact: true}
  - {path: /health}
  - {path: /docs}
  - {path: /redoc}
  - {path: /openapi.json}
  - {path: /auth/login, methods: [POST]}
  - {path: /auth/logout, methods: [POST]}     # only ever revokes the caller's own token
  - {path: /auth/personas, methods: [GET]}
  - {path: /auth/register, methods: [POST]}
  - {path: /auth/registration, methods: [GET]}

# -------------------------------------------------------------- route rules
# The matching rule with the longest path wins. Anything no rule matches is
# denied to every role without all_routes.
routes:
  - {path: /auth, roles: authenticated}

  # Online applications: the borrower submits and uploads; staff read. Which
  # application a borrower reaches (only their own) is checked in api/applications.py.
  - {path: /applications, methods: [GET], roles: [borrower, relationship_manager, area_manager]}
  # A borrower applies online; a relationship manager enters an assisted application.
  - {path: /applications, methods: [POST], roles: [borrower, relationship_manager]}
  # Staff correct the details on a file (Edit details); who entered it never changes.
  - {path: /applications, methods: [PUT], roles: [relationship_manager, area_manager]}

  # Pricing: the customer and the RM quote; only the RM prices a verified file.
  # The area manager prices too: opening a file to approve a rate re-prices it.
  - {path: /pricing/pre-assessment, methods: [POST], roles: [borrower, relationship_manager, area_manager]}
  - {path: /pricing/final-assessment, methods: [POST], roles: [relationship_manager, area_manager]}
  - {path: /pricing/decision, methods: [GET], roles: [area_manager, model_validation]}
  - {path: /pricing/audit, methods: [GET], roles: [area_manager, model_validation]}
  - {path: /pricing/policy/explain, methods: [GET], roles: [relationship_manager, area_manager, model_validation]}
  # The analysis behind a price - model drivers, the written explanation, uplift,
  # customer behaviour - is the area manager's and risk's, not the relationship manager's.
  - {path: /pricing/explain, roles: [area_manager, model_validation]}

  # Offers and rate approvals. Who may decide a request is checked in api/offers.py.
  - {path: /pricing/offers, roles: [relationship_manager, area_manager]}
  - {path: /pricing/rate-requests, roles: [relationship_manager, area_manager]}
  # The area's disbursements against target, by RM: the area manager's.
  - {path: /pricing/area, methods: [GET], roles: [area_manager]}
  - {path: /pricing/my, methods: [GET], roles: [relationship_manager]}

  # The human decision: the RM proposes, the area manager approves below RM authority.
  - {path: /pricing/override, methods: [POST], roles: [relationship_manager, area_manager]}
  - {path: /pricing/override/reasons, methods: [GET], roles: [relationship_manager, area_manager]}
  - {path: /pricing/uplift, methods: [POST], roles: [area_manager]}
  - {path: /pricing/outcome, roles: [relationship_manager]}
  - {path: /pricing/learning, methods: [GET], roles: [area_manager, model_validation]}

  # How the customer on the file is behaving, against similar customers in the loan book.
  - {path: /customers, methods: [GET], roles: [area_manager]}

  # Market context from the RM's conversation.
  # Competitor intelligence (the notes it reads and the lender tables): the area manager's.
  - {path: /notes, roles: [area_manager]}
  # Reading the notes on the one file being entered is part of an assisted application.
  - {path: /notes/extract, methods: [POST], roles: [relationship_manager, area_manager]}
  - {path: /competitors, roles: [area_manager]}
  # The online check on the quote in front of them: both who price a file.
  - {path: /competitors/check, methods: [POST], roles: [relationship_manager, area_manager]}
  - {path: /competitors/lenders, methods: [GET], roles: [relationship_manager, area_manager]}

  # Models, evidence and governance: risk and model validation.
  - {path: /model-cards, methods: [GET], roles: [relationship_manager, area_manager, model_validation]}
  - {path: /models, methods: [GET], roles: [model_validation]}
  - {path: /xai, roles: [model_validation]}
  - {path: /features, roles: [model_validation]}
  - {path: /tracking, methods: [GET], roles: [model_validation]}
  - {path: /system-of-record, methods: [GET], roles: [model_validation]}
  - {path: /control-tower, methods: [GET], roles: [model_validation]}
  - {path: /governance, roles: [model_validation]}
  # Proof that the engine learns: continuous learning and federated rounds.
  - {path: /learning, roles: [model_validation]}
  - {path: /agents, methods: [GET], roles: [model_validation]}
  - {path: /config, methods: [GET], roles: [model_validation]}
  # /connectors: administrator only (no rule).
