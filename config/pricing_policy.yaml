# Business-owned pricing and risk policy. Credit/Product edit this file; no code change required.
# Every rate in this file is an annual percentage (13.00 == 13% p.a.), spreads are in bps.
#
# STRUCTURE
#   Part A  - LEGACY-COMPATIBLE BLOCKS. Same keys and shapes as the live policy
#             (HL-POLICY-2026.13) so the existing pricing / yield / approval code keeps
#             working. Values are aligned to the new rule engine (13%-17% band,
#             grades A+..D, 36-120 months).
#   Part B  - NEW RULE ENGINE. Scorecards, grades, pricing matrix, eligibility limits,
#             mandatory rules and guardrails from "LAP and Housing Loan Rule Engine and
#             Scorecard". New code reads these; old code ignores them.
#   Part C  - ENGINE CONTRACT [added]. Action catalogue, model-variant routing, reason
#             codes, consistency invariants and the decisions taken on the draft's open
#             items. Defines words Part B uses but does not define.
#
# MARKERS
#   [added]    not in the circulated draft
#   [changed]  differs from the circulated draft; the comment says why
#   [carried]  dropped by the draft (which was built from 2026.10), restored from 2026.13
#   Everything unmarked is the circulated draft as written.
#
# BAND CONVENTION (Part B): bands are evaluated top to bottom, first match wins.
#   ge / gt / le / lt = >= / > / <= / <   ;   else: true = catch-all
#   score  = parameter score out of 100
#   action = optional; every action is defined in Part C `actions`
# Weighted contribution = weight x score / 100 ; final application score is out of 100.

policy_version: "HL-LAP-POLICY-2026.14"   # [changed] the draft was 2026.11; renumbered so it sorts after
                                          # the 2026.13 it replaces (D-01)
supersedes: "HL-POLICY-2026.13"         # [changed] draft said 2026.10; 2026.13 is the live file
based_on_draft_of: "HL-POLICY-2026.10"  # [added] the draft's Part A was aligned to this version
status: draft_pending_risk_approval     # weights/thresholds need Risk approval + back-test before auto-sanction
product: home_loan                      # legacy default product key (kept for old code)
products: [home_loan, lap]              # new: products covered by this policy
effective_from: "2026-12-01"            # set on approval
pricing_method: grade_matrix            # new: final ROI = grade base ROI + tenure adjustment
                                        # (legacy engine: floor + spreads + loadings, aligned below)

# =====================================================================================
# PART A - LEGACY-COMPATIBLE BLOCKS (same keys as HL-POLICY-2026.13)
# =====================================================================================

# ---------------------------------------------------------------- reference rate
reference:
  plr: 14.50                 # published prime lending rate (unchanged)
  card_rate_floor: 13.00     # was 8.60. No concession may reduce ROI below 13%
  card_rate_ceiling: 17.00   # was 16.50. No customer quote may exceed 17%

# ------------------------------------------------------------- cost of a rupee lent
# Unchanged. Used by the yield calculator: these drive "is this price actually
# profitable", not just "is this price allowed". If the lender cannot meet its
# profitability floor inside 13%-17%, reduce exposure or decline. Never cap an
# uneconomic rate at 17%.
economics:
  funding_cost_pct: 7.90     # marginal cost of funds
  servicing_cost_pct: 0.45   # opex to service the loan, annualised on outstanding
  acquisition_cost_pct: 0.55 # one-off sourcing/DSA/processing cost, % of disbursal
  processing_fee_pct: 0.50   # one-off income, % of disbursal
  capital_charge_pct: 0.35   # cost of regulatory capital held against the exposure
  discount_rate_pct: 9.00    # for NPV of the cash-flow stream
  behavioural_horizon_years: 8   # cap on modelled loan life; contractual max is now 10 years (120 months)

# ------------------------------------------------------------- permissible spreads
# Segment, LTV and property risk are now inside the weighted score and grade.
# Loadings are kept for structure but set to 0 to avoid duplicate premiums.
base_spread_bps:
  salaried_formal: 0
  salaried_informal: 0
  self_employed_professional: 0
  self_employed_non_professional: 0

risk_grade_loading_bps:     # over card_rate_floor (13.00) -> grade base ROI
  A+: 0                     # 13.00%
  A: 100                    # 14.00%
  B: 200                    # 15.00%
  C: 300                    # 16.00%
  D: null                   # no offer - decline under standard policy (pricing returns no card rate)
                            # How the grade is assigned until the scorecard runs: grades.assignment

ltv_loading_bps:            # LTV is scored (property scorecard); no extra loading
  - {max_ltv: 0.60, bps: 0}
  - {max_ltv: 0.70, bps: 0}
  - {max_ltv: 0.80, bps: 0}
  - {max_ltv: 0.90, bps: 0}

property_type_loading_bps:  # construction type; no loading. Occupancy/use is scored separately (PRP_PROPERTY_TYPE)
  resale_flat: 0
  builder_flat: 0
  self_construction: 0
  plot_plus_construction: 0
  lap_residential: 0        # new key
  lap_commercial: 0         # new key

tenure_loading_bps:         # NEW legacy-style block: tenure adjustment added to grade base
  - {max_months: 60,  bps: 0}
  - {max_months: 84,  bps: 50}
  - {max_months: 120, bps: 100}

deviation_loading_bps:      # no automatic premium for deviations already reflected in grade
  per_deviation: 0
  max_total: 0

# --------------------------------------------------------------- hard constraints
constraints:
  max_ltv: 0.90             # Housing absolute max; grade, regulatory slab and LAP caps in Part B are lower
  max_foir: 0.55            # A+ cap; grade-specific caps in Part B
  min_tenure_months: 36     # new key
  max_tenure_months: 120    # new key
  max_tenure_years: 10      # was 30. Kept for legacy code (120 months)
  min_credit_score: 675     # was 620. Below this: decline under standard policy
  new_to_credit_allowed: false        # no score / thin file -> separate model or manual review
  new_to_credit_min_spread_bps: 75    # kept for the approved NTC variant, when built
  max_loan_amount: 7500000            # unchanged; regulatory/grade/collateral limits still apply
  # A file may never be priced below its own risk-based floor, even by a human.
  absolute_discount_floor_bps: 60     # was 150. Still capped by card_rate_floor 13.00, so an
                                      # A+ file at 13.00 has no discount room at all
  min_age_years: 21                   # new key
  max_age_at_maturity: {salaried: 60, self_employed: 70}   # new key

# --------------------------------------------------- who may discount, and how much
# The recommendation engine never approves; it routes to the right human authority.
# Exceptions can never breach 13%-17% or 36-120 months, and no authority can
# override a legal prohibition or an unresolved mandatory rule.
approval_authority:          # was 25 / 50 / 100 / 150 / 999 bps
  - {level: "sales_officer",     max_discount_bps: 10, max_premium_bps: 0}
  - {level: "branch_manager",    max_discount_bps: 25, max_premium_bps: 0}
  - {level: "regional_manager",  max_discount_bps: 40, max_premium_bps: 0}
  - {level: "credit_head",       max_discount_bps: 60, max_premium_bps: 0}
  - {level: "pricing_committee", max_discount_bps: 999, max_premium_bps: 0}
  # [changed] premiums were 100 / 999 bps. The matrix rate for the file's grade and
  # tenure is the ceiling: risk is priced through the grade, so no authority adds a
  # premium on top (D-03). The permissible band is [card - 60 bps, card].

# ------------------------------------------------------------------ override rules
override:
  reason_mandatory: true
  allowed_reasons:
    - competitor_lower_rate
    - customer_threatening_bt
    - strong_negotiation
    - branch_competitive_pressure
    - month_end_target
    - salesperson_incentive
    - improve_s2d_conversion
    - relationship_value
    - local_market_knowledge
    - other
  # Reasons that must be evidenced (competitor sanction letter etc.) before they
  # are allowed to move the price. Unverified market claims are captured as
  # context and flagged, never applied automatically.
  evidence_required_reasons:
    - competitor_lower_rate
    - customer_threatening_bt
  max_unevidenced_discount_bps: 15    # was 50
  # [carried] The area manager may decline a discount and price ABOVE the
  # recommendation (a price uplift) where customers like this still accept - never
  # above the range quoted at Stage 1 or the policy ceiling. Recorded as a premium
  # override with one of these reasons. The suggestion proposes an uplift only when
  # acceptance falls by no more than max_acceptance_drop_pts and the loan's
  # expected value rises by at least min_value_gain_pct.
  # Read by analytics/decision_support.py and intake/offers.py; without it the
  # uplift suggestion silently disappears. An uplift never exceeds the matrix rate
  # (the card rate): it only gives back part of a discount (D-03).
  uplift:
    reasons: [customer_accepts_higher_rate, risk_not_fully_priced, relationship_upsell]
    max_acceptance_drop_pts: 3
    min_value_gain_pct: 0.5
  # new keys
  record_fields: [rule_id, evidence_ref, justification, amount_impact, grade_impact, approver, authority_level, expiry]
  never_overridable:
    - legal_prohibition
    - sanctions_prohibition
    - confirmed_material_fraud
    - rate_outside_13_17
    - tenure_outside_36_120
  pep_status_affects_roi: false
  high_risk_industry_auto_premium: false

# --------------------------------------------------- Stage-1 customer-facing rules
stage1:
  quantile_low: 0.10
  quantile_high: 0.90
  min_band_width_bps: 25     # never quote a falsely precise band
  max_band_width_bps: 125    # a band wider than this is not credible; widen confidence caveat instead
  round_to_bps: 5
  eligibility_foir_cap: 0.50 # more conservative than underwriting, pre-verification
  quote_band_floor: 13.00    # new key: Stage-1 band always clipped to 13%-17%
  quote_band_ceiling: 17.00

# ------------------------------------------------------------- fair pricing
# Commercial context (competitor pressure, branch targets, month end) normally
# prices a customer DOWN. When it prices a customer UP, that is a different kind
# of decision and a fair-lending reviewer should see it, so it is flagged rather
# than left as a number inside the explanation payload.
fair_pricing:
  commercial_uplift_review_bps: 10
  quote_validity_days: 30    # rate quotes are only meaningful for a bounded period
  risk_grade_scale:
    A+: "Best standard pricing; automatic recommendation after all checks"
    A: "Standard recommendation"
    B: "Controlled recommendation with tighter exposure"
    C: "Manual credit approval required"
    D: "Decline under standard policy"
  # new keys
  prohibited_credit_factors: [political_affiliation, religion, caste, unrelated_personal_attributes]
  decline_reason_style: factual        # e.g. "repeated financial bounces", never only "low score"; texts in Part C reason_codes
  kfs_required: true                   # Key Facts Statement with APR; APR may exceed 17% due to charges

# ------------------------------------------------------- yield-optimizer behaviour
# The rate comes from the matrix, minus any approved discount: the permissible band
# is [card - absolute_discount_floor, card], with card = the matrix rate (D-03).
optimizer:
  step_bps: 5
  # [changed] draft said permissible_band. Both settings now stay inside the matrix
  # rate, since no premium is allowed. stage2_interval is kept: in 2026.13 searching
  # the whole band walked 87% of files to the top of the range quoted at Stage 1
  # (sample of 150 booked files); +/-3 sigma of the Stage-2 market-practice rate
  # (about +/-0.30%) kept the final price near the indicative rate (median move +0.23%).
  search_space: stage2_interval
  permissible_band_source: pricing_matrix   # new key: card rate = matrix rate (risk_grade_loading_bps + tenure_loading_bps)
  # The final recommendation stays inside the indicative range the customer was
  # quoted at Stage 1. Verified details may move the price within that range, never
  # out of it. Policy still wins: where the quoted range lies outside the
  # permissible band, the band applies and the file says why.
  honour_indicative_band: true
  stage2_interval_sigmas: 3.0   # the commercial window around market practice
  # A recommendation whose conversion probability is below this is rejected even if
  # its expected value is highest.
  min_conversion_probability: 0.25
  # Portfolio guard-rail: do not recommend a price whose BT-out probability exceeds this.
  max_bt_out_probability: 0.45
  # Tie-break: within this % of best EV, prefer the lower rate.
  ev_tolerance_pct: 1.0
  # new keys
  candidate_tenures_months: [36, 48, 60, 72, 84, 96, 108, 120]
  recalc_dependent_parameters: [liquidity_buffer, dscr, residual_property_life]
  unresolved_calc_loop: refer
  freeze_initial_ltv_for_scoring: true # reducing amount must not re-improve the score

# =====================================================================================
# PART B - NEW RULE ENGINE
# =====================================================================================

# ---------------------------------------------------------------- decision flow
decision_flow:
  - select_model            # salaried or business; housing_loan or lap; variant routing in Part C
  - mandatory_rules         # identity, fraud, repayment history, property, legal, technical
  - calculate_score
  - assign_grade
  - calculate_pricing       # grade base ROI + tenure adjustment, within 13%-17%
  - calculate_amount        # min(request, stressed capacity, collateral, exposure)
  - validate_offer          # recheck score, EMI, DSCR, LTV, tenure, conditions
  - record_decision         # recommend | refer | hold | decline, with reasons
decision_priority:          # resolved in this order; a later step never clears an earlier one
  - legal_prohibitions_and_mandatory_screening
  - unresolved_evidence
  - referrals
  - category_floors
  - grade
  - capacity

# ---------------------------------------------------------------- borrower models
models:
  SAL:
    description: Salaried; repayment relies on salary
    category_weights: {individual: 45, banking: 15, property: 20, legal: 10, technical: 10}
  BUS:
    description: Proprietors, partners, directors on business income; eligible company/LLP LAP
    category_weights: {individual: 20, entity: 15, banking: 15, financials: 20, gst: 10, property: 10, legal: 5, technical: 5}
model_variants_required:    # no automatic weight redistribution; missing evidence -> hold
  - non_gst_business        # routing until built: Part C model_variant_routing
  - professional
  - thin_file_no_bureau
  - under_construction_housing
  - proprietor_without_commercial_rank
  - entity_borrower

# ---------------------------------------------------------------- scorecard parameters
# weight: {SAL: x, BUS: y}; a missing key means the parameter does not apply to that model.
scorecard:
  individual:
    IND_BUREAU_SCORE:
      weight: {SAL: 20, BUS: 10}
      rule: lowest usable score among income-contributing borrowers; named bureau and score version
      bands:
        - {ge: 800, score: 100}
        - {ge: 775, score: 90}
        - {ge: 750, score: 80}
        - {ge: 725, score: 65}
        - {ge: 700, score: 50}
        - {ge: 675, score: 30}
        - {else: true, score: 0, action: outside_policy}
    IND_MAX_DPD_24M:
      weight: {SAL: 8, BUS: 4}
      rule: worse of verified internal and external max DPD
      bands:
        - {le: 0,  score: 100}
        - {le: 7,  score: 80}
        - {le: 29, score: 60}
        - {le: 59, score: 30}
        - {le: 89, score: 0, action: refer}
        - {else: true, score: 0, action: outside_policy}   # same action as mandatory_rules.credit_history (D-04)
    IND_REVOLVING_UTIL_3M:
      weight: {SAL: 4, BUS: 2}
      not_applicable_score: 60       # no revolving facility = neutral, subject to validation
      bands:
        - {le: 0.30, score: 100}
        - {le: 0.50, score: 80}
        - {le: 0.70, score: 60}
        - {le: 0.90, score: 30}
        - {else: true, score: 0}
    IND_ENQUIRIES_6M:
      weight: {SAL: 3, BUS: 1}
      rule: deduplicate; exclude non-credit enquiries
      bands:
        - {le: 2, score: 100}
        - {le: 4, score: 80}
        - {le: 6, score: 60}
        - {le: 9, score: 30}
        - {else: true, score: 0}
    IND_EMPLOYMENT_STABILITY:
      weight: {SAL: 3}
      unit: years_with_current_employer
      bands:
        - {ge: 5,   score: 100}
        - {ge: 3,   score: 80}
        - {ge: 1,   score: 60}
        - {ge: 0.5, score: 40}
        - {else: true, score: 20, action: refer}
    IND_PROMOTER_EXPERIENCE:
      weight: {BUS: 2}
      unit: years_relevant_experience
      bands:
        - {ge: 10, score: 100}
        - {ge: 7,  score: 80}
        - {ge: 5,  score: 60}
        - {ge: 3,  score: 40}
        - {else: true, score: 20}
    IND_EMPLOYER_ASSESSMENT:
      weight: {SAL: 3}
      input: employer_subscore        # see subscores.employer
      requires: [EMP01_pass]
      bands:
        - {ge: 85, score: 100}
        - {ge: 70, score: 80}
        - {ge: 60, score: 60, action: refer}
        - {else: true, score: 0, action: hold}
    IND_INCOME_CONTINUITY_12M:
      weight: {SAL: 4, BUS: 1}
      unit: months_with_recurring_income
      bands:
        - {ge: 12, score: 100}
        - {ge: 11, score: 80}
        - {ge: 10, score: 60}
        - {ge: 9,  score: 40}
        - {else: true, score: 0, action: refer}

  entity:
    ENT_COMMERCIAL_RANK:
      weight: {BUS: 5}
      rule: supported 1-10 rank, 1 is best
      bands:
        - {le: 2, score: 100}
        - {le: 4, score: 80}
        - {le: 6, score: 60}
        - {le: 7, score: 40}
        - {else: true, score: 0, action: refer}
    ENT_BUSINESS_VINTAGE:
      weight: {BUS: 4}
      unit: years
      bands:
        - {ge: 10, score: 100}
        - {ge: 7,  score: 80}
        - {ge: 5,  score: 60}
        - {ge: 3,  score: 40}
        - {ge: 2,  score: 20}         # 2-3 years: 3-year financials scored on the years available (D-06)
        - {else: true, score: 0, action: outside_policy}
    ENT_INDUSTRY_RISK:
      weight: {BUS: 3}
      input: industry_subscore        # see subscores.industry
      bands:
        - {ge: 85, score: 100}        # low
        - {ge: 70, score: 80}         # medium-low
        - {ge: 55, score: 60}         # medium
        - {else: true, score: 30, action: refer}   # high
      prohibited_activity: reject
    ENT_TOP_CUSTOMER_SHARE:
      weight: {BUS: 3}
      bands:
        - {le: 0.20, score: 100}
        - {le: 0.30, score: 80}
        - {le: 0.40, score: 60}
        - {le: 0.50, score: 40}
        - {else: true, score: 20}     # above 0.50 also trips guardrail IND05 (REFER)

  banking:
    min_history_months: 12
    exclusions: [own_account_transfers, loan_proceeds, reversals, unsupported_credits]
    BNK_SALARY_CREDITS_6M:
      weight: {SAL: 5}
      bands:
        - {ge: 6, score: 100}
        - {ge: 5, score: 80}
        - {ge: 4, score: 60}
        - {else: true, score: 0, action: refer}
    BNK_LIQUIDITY_BUFFER:
      weight: {SAL: 5, BUS: 5}
      formula: avg_monthly_eligible_balance / proposed_emi   # CC/OD: verified headroom
      bands:
        - {ge: 3.0, score: 100}
        - {ge: 2.0, score: 80}
        - {ge: 1.0, score: 60}
        - {ge: 0.5, score: 40}
        - {else: true, score: 20}
    BNK_FINANCIAL_BOUNCES_12M:
      weight: {SAL: 5, BUS: 5}
      rule: insufficient-funds bounces only; technical failures excluded
      bands:
        - {le: 0, score: 100}
        - {le: 1, score: 80}
        - {le: 2, score: 60}
        - {le: 3, score: 30}
        - {else: true, score: 0, action: refer}
    BNK_WC_DISCIPLINE:
      weight: {BUS: 5}
      unit: unauthorised_excess_days_12m
      not_applicable_score: 60       # [changed] no CC/OD facility = neutral, as IND_REVOLVING_UTIL_3M (D-07)
      bands:
        - {le: 0,  score: 100}
        - {le: 7,  score: 80}
        - {le: 15, score: 60}
        - {le: 30, score: 30}
        - {else: true, score: 0, action: refer}

  financials:
    FIN_DSCR:
      weight: {BUS: 7}
      formula: cfads / (existing_debt_service + proposed_debt_service)
      bands:
        - {ge: 1.75, score: 100}
        - {ge: 1.50, score: 80}
        - {ge: 1.30, score: 60}
        - {ge: 1.20, score: 40}
        - {else: true, score: 0, action: outside_policy}
    FIN_DEBT_TO_TNW:
      weight: {BUS: 4}
      non_positive_tnw: outside_policy
      bands:
        - {le: 1, score: 100}
        - {le: 2, score: 80}
        - {le: 3, score: 60}
        - {le: 4, score: 30}
        - {else: true, score: 0, action: refer}
    FIN_PROFITABILITY_3Y:
      weight: {BUS: 3}
      categories:                     # latest year first: every pattern now has a category (D-05)
        positive_all_3: 100                  # + + +
        latest_2_positive: 80                # + + -
        latest_positive_middle_loss: 60      # + - +   [added]
        latest_positive_prior_2_negative: 40 # + - -
        latest_loss: {score: 0, action: refer}
      fewer_than_3_years:             # [added] 2-3 year businesses (D-06)
        two_years: {both_positive: 80, latest_positive_prior_negative: 40, latest_loss: {score: 0, action: refer}}
        one_year_or_less: {score: 0, action: refer}
    FIN_REVENUE_CAGR_3Y:
      weight: {BUS: 3}
      fewer_than_3_years: {use: available_years_growth, max_score: 80}   # [added] same bands, capped (D-06)
      bands:
        - {ge: 0.15,  score: 100}
        - {ge: 0.08,  score: 80}
        - {ge: 0.00,  score: 60}
        - {ge: -0.10, score: 30}
        - {else: true, score: 0, action: refer}
    FIN_ITR_RECONCILIATION:
      weight: {BUS: 3}
      unit: max_unexplained_variance
      bands:
        - {le: 0.02, score: 100}
        - {le: 0.05, score: 80}
        - {le: 0.10, score: 50}
        - {else: true, score: 0, action: hold}   # same threshold as guardrail FIN01

  gst:
    note: GST turnover is never income available for EMI
    GST_ON_TIME_FILING_12M:
      weight: {BUS: 4}
      overdue_mandatory_return: hold
      bands:
        - {ge: 1.00, score: 100}
        - {ge: 0.90, score: 80}
        - {ge: 0.75, score: 60}
        - {else: true, score: 20, action: refer}
    GST_BANKING_VARIANCE:
      weight: {BUS: 4}
      bands:
        - {le: 0.05, score: 100}
        - {le: 0.10, score: 80}
        - {le: 0.15, score: 60}
        - {le: 0.20, score: 30}
        - {else: true, score: 0, action: hold}
    GST_TURNOVER_GROWTH_T12M:
      weight: {BUS: 2}
      bands:
        - {ge: 0.15,  score: 100}
        - {ge: 0.05,  score: 80}
        - {ge: 0.00,  score: 60}
        - {ge: -0.10, score: 30}
        - {else: true, score: 0, action: refer}

  property:
    PRP_PROPERTY_TYPE:
      weight: {SAL: 7, BUS: 3}
      input: property_use             # [added] its own intake field (D-08); property_type stays the
                                      # construction type (LGD table, builder subscore) - no mapping between them
      missing_input: hold             # evidence state NOT_FOUND: no default category
      categories:
        self_occupied_residential: 100
        let_out_residential: 80
        self_used_commercial: {score: 70, products: [lap]}
        let_out_commercial: {score: 60, products: [lap]}
        approved_industrial: {score: 40, action: refer, products: [lap]}
        prohibited_or_unapproved: {score: 0, action: reject}
    PRP_MARKETABILITY:
      weight: {SAL: 6, BUS: 3}
      unit: expected_sale_months
      bands:
        - {le: 6,  score: 100}
        - {le: 9,  score: 80}
        - {le: 12, score: 60}
        - {le: 18, score: 30}
        - {else: true, score: 0, action: outside_policy}
    PRP_REQUESTED_LTV:
      weight: {SAL: 7, BUS: 4}
      rule: frozen initial requested LTV on verified value
      bands_by_product:
        home_loan:
          - {le: 0.50, score: 100}
          - {le: 0.60, score: 90}
          - {le: 0.70, score: 80}
          - {le: 0.75, score: 70}
          - {le: 0.80, score: 60}
          - {le: 0.90, score: 40}   # only where permitted (grade A+ and loan <= Rs 30 lakh slab)
          - {else: true, score: 0, action: outside_policy}
        lap:
          - {le: 0.40, score: 100}
          - {le: 0.50, score: 80}
          - {le: 0.60, score: 60}
          - {le: 0.65, score: 40}
          - {else: true, score: 0, action: outside_policy}

  legal:
    LEG_TITLE_MORTGAGE:
      weight: {SAL: 6, BUS: 3}
      categories:
        clear_title_mortgage_ready: 100
        clear_title_routine_pending: {score: 80, action: condition}
        material_unresolved_defect: {score: 0, action: hold}
    LEG_APPROVALS_OWNERSHIP:
      weight: {SAL: 4, BUS: 2}
      categories:
        all_clear: 100
        routine_items_pending: {score: 80, action: condition}
        material_problem: {score: 0, action: hold}

  technical:
    TEC_PHYSICAL_CONDITION:
      weight: {SAL: 4, BUS: 2}
      categories:
        sound: 100
        minor_non_structural: 80
        material_repair: {score: 40, action: refer}
        unsafe: {score: 0, action: reject}
    TEC_VALUATION_VARIANCE:
      weight: {SAL: 3, BUS: 2}
      formula: abs(val_1 - val_2) / min(val_1, val_2)
      single_valuation_products: approved_alternative   # never assume zero variance
      bands:
        - {le: 0.05, score: 100}
        - {le: 0.10, score: 80}
        - {le: 0.15, score: 50, action: refer}
        - {else: true, score: 0, action: hold}           # same threshold as guardrail PRP07
    TEC_RESIDUAL_LIFE:
      weight: {SAL: 3, BUS: 1}
      unit: years_beyond_tenure
      bands:
        - {ge: 15, score: 100}
        - {ge: 10, score: 80}
        - {ge: 5,  score: 60}
        - {ge: 0,  score: 30, action: refer}
        - {else: true, score: 0, action: shorten_tenure_or_reject}

# ---------------------------------------------------------------- subscores (feed existing parameters, never added to the 100)
subscores:
  employer:
    factors:
      payroll_punctuality_6m:
        weight: 35
        bands: [{le: 0, score: 100}, {le: 1, score: 70}, {le: 2, score: 40}, {else: true, score: 0, action: refer}]   # count of delays >7 days
      operating_continuity_years:
        weight: 25
        bands: [{ge: 5, score: 100}, {ge: 3, score: 80}, {ge: 1, score: 60}, {else: true, score: 40, action: refer}]
      financial_resilience:
        weight: 20
        categories: {verified_stable: 100, moderate_stress: 60, severe_unresolved_stress: {score: 0, action: refer}, missing_evidence: inconclusive}
      portfolio_concentration:
        weight: 20
        bands: [{le: 0.75, score: 100}, {le: 0.90, score: 80}, {le: 1.00, score: 60}, {else: true, score: 0, action: hold_new_exposure}]
    inconclusive_mandatory_factor: no_automatic_recommendation
  industry:
    factors:      # each scored 100 / 60 / 20
      demand_cyclicality: 25
      regulation_licences: 20     # missing mandatory licence is a gate, not a score
      margins_cash_conversion: 20
      counterparty_dependence: 20
      commodity_fx_climate: 15
    assumptions_dated_and_approved_by: portfolio_risk
  builder:
    applies_to: [under_construction_housing, primary_sale_housing]
    factors:
      delivery_performance:
        weight: 30
        definition: on-time = within 6 months of original disclosed date, projects due in last 5 years
        bands: [{ge: 0.90, score: 100}, {ge: 0.75, score: 80}, {ge: 0.60, score: 60}, {else: true, score: 20}]
      funding_coverage:
        weight: 25
        bands: [{ge: 1.20, score: 100}, {ge: 1.10, score: 80}, {ge: 1.00, score: 60}, {else: true, score: 0, action: hold}]
      dispute_impact:
        weight: 20
        categories: {none: 100, manageable: 60, material_unresolved: {score: 0, action: hold}}
      disclosure_quality:
        weight: 15
        categories: {complete: 100, minor_curable_gaps: 60, material_gaps: {score: 0, action: hold}}
      schedule_variance_months:
        weight: 10
        bands: [{le: 3, score: 100}, {le: 6, score: 80}, {le: 12, score: 50, action: refer}, {else: true, score: 0, action: hold}]
    outcome_bands:
      - {ge: 80, outcome: standard_project_consideration}
      - {ge: 70, outcome: project_risk_approval}
      - {ge: 50, outcome: senior_committee_referral}
      - {else: true, outcome: outside_standard_uc_policy}
    never_increases: [borrower_score, ltv]

# ---------------------------------------------------------------- grades
grades:
  bands:
    - {ge: 90, grade: A+, decision: recommend_auto}
    - {ge: 80, grade: A,  decision: recommend}
    - {ge: 70, grade: B,  decision: controlled_recommend}
    - {ge: 60, grade: C,  decision: manual_credit_approval}
    - {else: true, grade: D, decision: decline}
  category_floor_normalized: 60     # every applicable category >= 60/100 for automatic recommendation
  below_category_floor: refer       # e.g. overall 85 with banking 40 -> refer
  legal_technical_must_be_acceptable: true
  score_is_not_pd: true             # a score of 90 is not a 90% repayment probability
  assignment:                       # [added] how a file gets its grade today (D-02)
    source: pd_bands                # until the scorecard engine is in production, then: scorecard
    pd_bands: model_config.yaml risk.grade_cutoffs   # annual PD <= 1.0% A+, 2.5% A, 5.0% B, 9.0% C, above: D
    note: the former A-E PD bands each moved one letter up; only the worst band (former E) is declined

# ---------------------------------------------------------------- pricing (authoritative)
pricing:
  basis: annual_monthly_reducing_balance
  roi_floor: 13.00
  roi_ceiling: 17.00
  grade_base_roi: {A+: 13.00, A: 14.00, B: 15.00, C: 16.00, D: null}
  tenure_adjustment:
    - {min_months: 36, max_months: 60,  add_pct: 0.00}
    - {min_months: 61, max_months: 84,  add_pct: 0.50}
    - {min_months: 85, max_months: 120, add_pct: 1.00}
  matrix:             # grade -> [36-60, 61-84, 85-120] months
    A+: [13.00, 13.50, 14.00]
    A:  [14.00, 14.50, 15.00]
    B:  [15.00, 15.50, 16.00]
    C:  [16.00, 16.50, 17.00]
    D:  [null, null, null]
  # The same grid is written three ways (matrix; grade_base_roi + tenure_adjustment;
  # Part A floor + risk_grade_loading_bps + tenure_loading_bps). Part C invariants
  # INV-02..INV-04 require all three to agree; the matrix wins on conflict.
  d_grade_cannot_buy_eligibility: true
  stress_test_add_pct: 2.00         # the one stress add-on (D-09): affordability is tested at quoted ROI + 2pp (may exceed 17%)

# ---------------------------------------------------------------- eligibility limits by grade
eligibility_limits:
  A+: {foir_max: 0.55, dscr_min: 1.25, hl_ltv_max: 0.90, lap_res_ltv_max: 0.65, lap_comm_ltv_max: 0.60}
  A:  {foir_max: 0.50, dscr_min: 1.30, hl_ltv_max: 0.80, lap_res_ltv_max: 0.65, lap_comm_ltv_max: 0.55}
  B:  {foir_max: 0.45, dscr_min: 1.40, hl_ltv_max: 0.75, lap_res_ltv_max: 0.60, lap_comm_ltv_max: 0.50}
  C:  {foir_max: 0.40, dscr_min: 1.50, hl_ltv_max: 0.70, lap_res_ltv_max: 0.50, lap_comm_ltv_max: 0.45}
  D:  null
housing_regulatory_ltv:     # RBI HFC Directions 2025 para 58; housing only, never copied to LAP
  - {max_amount: 3000000, max_ltv: 0.90}
  - {max_amount: 7500000, max_ltv: 0.80}
  - {else: true,          max_ltv: 0.75}   # unreachable while max_loan_amount = 7,500,000
effective_ltv: min(grade_ceiling, regulatory_slab_for_candidate_amount, collateral_ceiling)
affordability:
  salaried: available_emi = net_monthly_income * grade_foir_max - existing_obligations
  business: new_annual_debt_service = annual_cfads / grade_dscr_min - existing_debt_service
  principal: P = EMI * (1 - (1 + r)^-n) / r      # r = stressed annual rate / 12
  recommended_amount: min(request, stressed_capacity, collateral_limit, exposure_limit)
  household_surplus_required: true
  turnover_is_not_cfads: true
  fails_at_120_months: reduce_or_decline
  # [added] The pricing engine tests the salaried rule on every file: stressed EMI plus
  # existing obligations within the grade's foir_max of verified income. The business
  # DSCR rule needs CFADS from financial statements, which intake does not capture yet;
  # it applies through FIN_DSCR when the business scorecard runs.

# ---------------------------------------------------------------- mandatory rules
mandatory_rules:
  age: {min: 21, max_at_maturity: {salaried: 60, self_employed: 70}, breach: shorten_tenure_or_refer}
  roi_tenure: {roi_pct: [13.00, 17.00], tenure_months: [36, 120], breach: no_standard_offer}
  bureau: {min: 675, below: decline, no_score: separate_model_or_manual}
  credit_history:
    material_current_overdue: refer
    dpd_90_plus_24m: outside_policy             # [changed] was outside_auto_approval; one action with IND_MAX_DPD_24M (D-04)
    write_off_or_settlement: outside_policy     # [changed] was outside_auto_approval (D-04)
  kyc_fraud: {confirmed_fabrication_or_impersonation: reject}
  sanctions_pep: {possible_match: resolve, prohibited: reject, pep: edd_and_designated_approval}
  crimecheck: {relevant_finding: refer, name_match_only_reject: false}
  property: {material_unresolved_defect: hold_or_reject}
  capacity: {failed_foir_dscr_surplus: reduce_or_decline}
  high_score_overrides_mandatory: false

# ---------------------------------------------------------------- guardrails
# Every rule is written in three parts:
#   pre        when the rule applies: the parties on the file it covers
#              ("all" = every party below; "borrowers" = see party_groups)
#   condition  what is tested: the check, its evidence settings, and any trigger the
#              engine evaluates from observations (metric_ge / _gt / _le / _lt; with
#              several triggers, match: any | all). With no trigger, the owner team
#              records the finding.
#   post       what follows when the condition is met: the outcome, other outcomes
#              the owner may record (alternatives), the owner, and any treatment or
#              follow-up action.
# A finding outside a rule's post outcomes, or on a rule whose pre fails, is rejected.
guardrails:
  outcomes: [PASS, HOLD, REFER, DECLINE, CONDITION, OUTSIDE_POLICY]
  evidence_states: [NOT_APPLICABLE, NOT_FOUND, INCONCLUSIVE, VERIFIED_CLEAR, VERIFIED_ADVERSE]
  not_applicable_requires_rationale: true
  provider_failure_is_pass: false
  outside_credit_score: [aml, pep, criminal_investigation]
  parties: [applicants, co_applicants, entity_and_controllers, security_providers_and_sellers, employer, builder_project, intermediaries]
  party_groups:
    borrowers: [applicants, co_applicants, entity_and_controllers]
  no_extra_history_deduction: true     # historical behaviour rules (HIS)
  rules:
    # AML and identity
    AML01:
      pre:       {parties: [all]}
      condition: {check: identity_integrity}
      post:      {outcome: HOLD, owner: kyc}
    AML02:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: entity_existence_authority}
      post:      {outcome: HOLD, owner: kyc_legal}
    AML03:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: beneficial_ownership}
      post:      {outcome: HOLD, owner: compliance}
    AML04:
      pre:       {parties: [all]}
      condition: {check: sanctions_screening}
      post:      {outcome: HOLD, alternatives: [DECLINE], action: statutory_action, owner: compliance}
    AML05:
      pre:       {parties: [borrowers]}
      condition: {check: source_of_contribution, trace_pct: 1.00}
      post:      {outcome: HOLD, owner: credit_compliance}
    AML06:
      pre:       {parties: [all]}
      condition: {check: transaction_rationale}
      post:      {outcome: REFER, owner: fraud_compliance}
    AML07:
      pre:       {parties: [borrowers]}
      condition:
        check: banking_patterns
        trigger: {unexplained_cash_share_ge: 0.20, unexplained_third_party_share_ge: 0.10, pass_through_7d_gt: 0.50}
        match: any
        note: investigation triggers, not statutory reporting thresholds
      post:      {outcome: REFER, owner: aml_analyst}
    AML08:
      pre:       {parties: [borrowers]}
      condition: {check: repayment_source_end_use}
      post:      {outcome: REFER, owner: monitoring}
    # CrimeCheck / PEP
    CRM01:
      pre:       {parties: [all]}
      condition: {check: match_resolution}
      post:      {outcome: HOLD, owner: screening_analyst}
    CRM02:
      pre:       {parties: [all]}
      condition: {check: case_relevance, scope: material_cases}
      post:      {outcome: REFER, owner: legal}
    CRM03:
      pre:       {parties: [all]}
      condition: {check: material_allegations}
      post:      {outcome: REFER, owner: legal_fraud_compliance}
    CRM04:
      pre:       {parties: [all]}
      condition: {check: verified_adverse_outcome, scope: prohibited}
      post:      {outcome: DECLINE, owner: legal}
    CRM05:
      pre:       {parties: [all]}
      condition: {check: non_material_litigation}
      post:      {outcome: PASS, action: document_only, owner: legal}
    PEP01:
      pre:       {parties: [all]}
      condition: {check: pep_relationship}
      post:      {outcome: REFER, owner: compliance}
    PEP02:
      pre:       {parties: [all]}
      condition: {check: enhanced_due_diligence}
      post:      {outcome: HOLD, until: edd_approved, owner: compliance}
    PEP03:
      pre:       {parties: [all]}
      condition: {check: status_change}
      post:      {outcome: REFER, action: re_review, owner: compliance}
    # Employer
    EMP01:
      pre:       {parties: [employer]}
      condition: {check: existence_and_employment}
      post:      {outcome: HOLD, owner: verification}
    EMP02:
      pre:       {parties: [employer]}
      condition: {check: payroll_authenticity, min_months: 6}
      post:      {outcome: HOLD, alternatives: [DECLINE], decline_when: confirmed_fraud, owner: verification}
    EMP03:
      pre:       {parties: [employer]}
      condition: {check: income_change, trigger: {latest_3m_vs_prior_3m_gt: 0.20}}
      post:      {outcome: REFER, treatment: exclude_unexplained_uplift}
    EMP04:
      pre:       {parties: [employer]}
      condition: {check: employment_uncertainty, trigger: {contract_expiry_months_le: 6}}
      post:      {outcome: REFER, owner: credit}
    EMP05:
      pre:       {parties: [employer]}
      condition: {check: employer_stress}
      post:      {outcome: REFER, owner: credit}
    EMP06:
      pre:       {parties: [employer]}
      condition: {check: concentration_conflict}
      post:      {outcome: REFER, alternatives: [HOLD], owner: portfolio_risk}
    # Historical behaviour
    HIS01:
      pre:       {parties: [borrowers]}
      condition: {check: current_obligations}
      post:      {outcome: HOLD, alternatives: [REFER], owner: credit}
    HIS02:
      pre:       {parties: [borrowers]}
      condition: {check: delinquency_recurrence, trigger: {distinct_1plus_dpd_months_12m_ge: 3}}
      post:      {outcome: REFER}
    HIS03:
      pre:       {parties: [borrowers]}
      condition: {check: severe_adverse_events}
      post:      {outcome: OUTSIDE_POLICY}   # [changed] was REFER, action outside_auto_approval (D-04)
    HIS04:
      pre:       {parties: [borrowers]}
      condition: {check: bounces_and_ptp, trigger: {unfulfilled_ptp_6m_ge: 3}}
      post:      {outcome: REFER}
    HIS05:
      pre:       {parties: [borrowers]}
      condition: {check: loan_stacking, trigger: {new_facilities_90d_ge: 3, obligations_increase_gt: 0.20}, match: any}
      post:      {outcome: REFER}
    HIS06:
      pre:       {parties: [borrowers]}
      condition: {check: top_up_refinance, trigger: {paid_emis_lt: 12}}
      post:      {outcome: REFER}
    HIS07:
      pre:       {parties: [borrowers]}
      condition: {check: disputes_hardship, scope: disputed_facts}
      post:      {outcome: HOLD}
    HIS08:
      pre:       {parties: [borrowers]}
      condition: {check: earlier_fraud_exit}
      post:      {outcome: HOLD, action: fraud_legal_review}
    # Industry
    IND01:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: activity_and_licence}
      post:      {outcome: HOLD, alternatives: [DECLINE], owner: legal_credit}
    IND02:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: sector_exposure, scope: above_limit, warn_at_usage: 0.90}
      post:      {outcome: HOLD, owner: portfolio_risk}
    IND03:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: business_deterioration, trigger: {sales_fall_gt: 0.20, gross_margin_fall_pp_gt: 5}, match: any}
      post:      {outcome: REFER}
    IND04:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: working_capital_quality, trigger: {receivables_90d_share_gt: 0.25}}
      post:      {outcome: REFER}
    IND05:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: counterparty_shock, trigger: {top_customer_or_supplier_gt: 0.50}}
      post:      {outcome: REFER}
    IND06:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: related_party_leverage}
      post:      {outcome: REFER, treatment: adjust_leverage, owner: credit}
    # Property
    PRP01:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: identity_and_ownership}
      post:      {outcome: HOLD, owner: legal_technical}
    PRP02:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: title_and_authority}
      post:      {outcome: HOLD, owner: panel_advocate}
    PRP03:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: charges_and_attachments}
      post:      {outcome: HOLD, owner: legal}
    PRP04:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: approvals_and_use}
      post:      {outcome: HOLD, alternatives: [DECLINE], owner: legal_technical}
    PRP05:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: restricted_collateral}
      post:      {outcome: OUTSIDE_POLICY, owner: legal}
    PRP06:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: possession_liquidity}
      post:      {outcome: REFER, owner: collateral}
    PRP07:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: valuation_integrity, trigger: {inter_valuer_diff_gt: 0.15}}
      post:      {outcome: HOLD}
    PRP08:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: safety_hazard}
      post:      {outcome: REFER, alternatives: [DECLINE], decline_when: unsafe}
    PRP09:
      pre:       {parties: [security_providers_and_sellers]}
      condition: {check: end_use_cash_trail}
      post:      {outcome: HOLD, owner: fraud_legal}
    # Builder / project
    BLD01:
      pre:       {parties: [builder_project]}
      condition: {check: rera_registration}
      post:      {outcome: HOLD, owner: legal}
    BLD02:
      pre:       {parties: [builder_project]}
      condition: {check: promoter_project_match}
      post:      {outcome: HOLD, owner: verification_legal}
    BLD03:
      pre:       {parties: [builder_project]}
      condition: {check: title_approvals_finance}
      post:      {outcome: HOLD, owner: project_legal}
    BLD04:
      pre:       {parties: [builder_project]}
      condition: {check: delivery_record, lookback_years: 5}
      post:      {outcome: REFER, owner: project_risk}
    BLD05:
      pre:       {parties: [builder_project]}
      condition: {check: disputes_insolvency}
      post:      {outcome: REFER, alternatives: [HOLD], owner: legal}
    BLD06:
      pre:       {parties: [builder_project]}
      condition: {check: project_viability, scope: funding_gap}
      post:      {outcome: HOLD}
    BLD07:
      pre:       {parties: [builder_project]}
      condition: {check: progress_diversion}
      post:      {outcome: HOLD, action: hold_new_tranche, owner: project_risk}
    # Banking / financial / GST / fraud
    BNK01:
      pre:       {parties: [borrowers]}
      condition: {check: statement_completeness, min_months: 12}
      post:      {outcome: HOLD}
    BNK02:
      pre:       {parties: [borrowers]}
      condition: {check: cash_flow_integrity}
      post:      {outcome: REFER, treatment: recompute_cash_flow}
    BNK03:
      pre:       {parties: [borrowers]}
      condition: {check: debt_completeness, scope: material_mismatch}
      post:      {outcome: HOLD}
    FIN01:
      pre:       {parties: [borrowers]}
      condition: {check: income_substantiation, trigger: {unexplained_variance_gt: 0.10}}
      post:      {outcome: HOLD}
    FIN02:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: solvency_profitability}
      post:      {outcome: REFER, alternatives: [OUTSIDE_POLICY]}
    FIN03:
      pre:       {parties: [borrowers]}
      condition: {check: capacity_stress, business_scenario: {sales_shock: -0.20, margin_shock_pp: -3}}
      post:      {outcome: REFER, alternatives: [DECLINE], treatment: reduce_amount}
    GST01:
      pre:       {parties: [entity_and_controllers]}
      condition: {check: registration_returns}
      post:      {outcome: HOLD}
    FRD01:
      pre:       {parties: [all]}
      condition: {check: application_linkage, guilt_by_association: false}
      post:      {outcome: REFER, action: investigate}
    FRD02:
      pre:       {parties: [intermediaries]}
      condition: {check: valuer_channel_conduct}
      post:      {outcome: HOLD, owner: independent_recheck}

# ---------------------------------------------------------------- execution controls
controls:
  evidence_freshness_days: {bureau: 30, banking: 30, employer_verification: 30, legal_search: 90, technical_valuation: 90}
  screening_refresh_before_disbursement_hours: 24
  tranche_controls: [progress_certificate, approvals, margin_contribution, project_status, verified_payee]
  late_payee_change: dual_approval_and_reverification
  separation_of_duties:
    credit: risk_exceptions
    compliance: aml_pep
    legal: title
    technical: valuation_safety
    operations: disbursement_conditions
  approval_sequence: [kyc_compliance, fraud_legal_technical, credit, delegated_authority, operations]
  cross_team_clearance_allowed: false
  exposure_checks: [borrower, household, connected_group, employer, industry, geography, builder_project, channel]
  monitoring: [early_dpd, bounces, unusual_prepayment, project_delay, employer_sector_stress, ownership_change, screening_events]
  monitoring_alert_changes_spread: false
  recalc_on_change: [income, debt, valuation, grade, tenure]

# ---------------------------------------------------------------- decision records
decision_record:
  parameter_fields: [parameter_id, model_id, source, evidence_date, raw_value, band, score, weight, contribution, reason_code, policy_version]
  rule_fields: [rule_id, rule_version, party, raw_observation, evidence_ref, source_date, freshness, confidence, match_identifiers, outcome, reason, owner, case_id, resolution, approver, conditions, expiry, next_review_date]
  final_fields: [borrower_model, scorecard_version, final_score, grade, requested_amount, recommended_amount, roi, tenure_months, emi, stressed_capacity, binding_limit, evidence_refs, conditions, decision_reasons, calc_timestamp, override_approval]
  stages: [provisional_eligibility, conditional_sanction, disbursement_ready]
  model_ids: {salaried_hl: SAL_HL_V1, salaried_lap: SAL_LAP_V1, business_hl: BUS_HL_V1, business_lap: BUS_LAP_V1}

# ---------------------------------------------------------------- acceptance tests
acceptance_criteria:
  - score_90_plus_never_bypasses_unresolved_mandatory_rule
  - provider_error_never_clean_result
  - name_only_match_never_auto_reject
  - pep_status_never_increases_roi
  - employer_and_builder_never_counted_twice
  - salaried_and_business_weights_each_total_100
  - revised_obligations_or_income_force_recalc
  - mortgage_and_tranche_conditions_block_disbursement
  - referrals_retain_authorized_owner_decision
  - every_quote_within_13_17_pct_and_36_120_months
  # [added]
  - grade_d_never_priced                            # no fallback loading for a null grade
  - no_quote_above_the_matrix_rate                  # no premium authority (D-03)
  - affordability_tested_at_the_stressed_rate       # quoted ROI + stress_test_add_pct, grade foir_max
  - every_action_resolves_through_actions_catalogue  # no unknown verb reaches record_decision
  - every_decline_or_refer_carries_a_reason_code
  - long_tenure_quote_includes_tenure_adjustment     # 61-120 months priced off the matrix column

# =====================================================================================
# PART C - ENGINE CONTRACT  [added]
# =====================================================================================

# ---------------------------------------------------------------- action catalogue
# Every action or outcome word used in Part B, the guardrail outcome it resolves to,
# and who may clear it. Combined outcomes on one file: the worst wins, in this order
#   DECLINE > OUTSIDE_POLICY > HOLD > REFER > CONDITION > PASS
# (the rule engine's SEVERITY order; OUTSIDE_POLICY = no standard offer, non-standard route only)
# and decision_priority decides which step speaks first. A compound action ("X_or_Y")
# resolves to the stricter of the two until its named owner records which applies;
# the engine never picks the lenient one on its own (provider_failure_is_pass: false
# applies to people as much as to providers).
actions:
  # --- terminal
  reject:                       {outcome: DECLINE, cleared_by: none}
  decline:                      {outcome: DECLINE, cleared_by: none}
  DECLINE:                      {outcome: DECLINE, cleared_by: none}
  no_standard_offer:            {outcome: DECLINE, cleared_by: none, note: "rate or tenure outside 13-17% / 36-120 months"}
  OUTSIDE_POLICY:               {outcome: OUTSIDE_POLICY, cleared_by: credit_head, as: recorded_policy_deviation}
  outside_policy:               {outcome: OUTSIDE_POLICY, cleared_by: credit_head, as: recorded_policy_deviation,
                                 note: "no standard offer; only route is a deviation recorded with override.record_fields (D-04)"}
  outside_standard_uc_policy:   {outcome: DECLINE, cleared_by: none}
  # --- evidence or resolution outstanding
  hold:                         {outcome: HOLD, cleared_by: rule_owner}
  HOLD:                         {outcome: HOLD, cleared_by: rule_owner}
  hold_new_tranche:             {outcome: HOLD, cleared_by: project_risk, scope: next_tranche_only}
  statutory_action:             {outcome: HOLD, cleared_by: compliance, note: "statutory reporting duty (AML04); credit cannot clear it"}
  hold_new_exposure:            {outcome: HOLD, cleared_by: portfolio_risk}
  inconclusive:                 {outcome: HOLD, cleared_by: rule_owner, note: "missing evidence on a subscore factor"}
  no_automatic_recommendation:  {outcome: HOLD, cleared_by: rule_owner, note: "subscores.employer.inconclusive_mandatory_factor"}
  resolve:                      {outcome: HOLD, cleared_by: compliance, note: "possible sanctions match until resolved"}
  edd_and_designated_approval:  {outcome: HOLD, cleared_by: compliance}
  investigate:                  {outcome: HOLD, cleared_by: fraud}
  fraud_legal_review:           {outcome: HOLD, cleared_by: fraud_legal}
  # --- compound: stricter of the two until the owner decides
  hold_or_reject:               {outcome: HOLD, worst_case: DECLINE, cleared_by: legal_technical}
  shorten_tenure_or_reject:     {outcome: CONDITION, worst_case: DECLINE, condition: "tenure shortened until the breach clears; DECLINE if no tenure >= 36 months clears it"}
  shorten_tenure_or_refer:      {outcome: CONDITION, worst_case: REFER, condition: "tenure shortened until the breach clears; REFER if no tenure >= 36 months clears it"}
  reduce_or_decline:            {outcome: CONDITION, worst_case: DECLINE, condition: "amount reduced to stressed capacity; DECLINE if below the product minimum or fails at 120 months"}
  separate_model_or_manual:     {outcome: REFER, cleared_by: credit, note: "until the thin-file variant exists, manual review"}
  # --- referral to an authorised owner
  refer:                        {outcome: REFER, cleared_by: rule_owner}
  REFER:                        {outcome: REFER, cleared_by: rule_owner}
  manual_credit_approval:       {outcome: REFER, cleared_by: credit}
  project_risk_approval:        {outcome: REFER, cleared_by: project_risk}
  senior_committee_referral:    {outcome: REFER, cleared_by: credit_committee}
  re_review:                    {outcome: REFER, cleared_by: compliance}
  # --- proceed with obligations
  condition:                    {outcome: CONDITION, cleared_by: operations, note: "blocks disbursement, not sanction"}
  document_only:                {outcome: PASS, note: "recorded on file; no effect on decision"}
  # --- grade decisions (grades.bands)
  recommend_auto:               {outcome: PASS}
  recommend:                    {outcome: PASS}
  controlled_recommend:         {outcome: PASS, note: "eligibility_limits for grade B apply"}
  standard_project_consideration: {outcome: PASS}

# ---------------------------------------------------------------- model-variant routing
# model_variants_required are named but not built. Until a variant is approved, a
# file that needs one is NOT scored on SAL/BUS with weights redistributed; it routes
# as below. "when" is how the engine recognises the file.
model_variant_routing:
  non_gst_business:
    when: borrower model BUS and no GST registration
    status: not_built
    route: HOLD            # GST category (10 of 100) would have no evidence
  professional:
    when: segment self_employed_professional (doctor, CA, architect, lawyer, ...)
    status: not_built
    route: HOLD
  thin_file_no_bureau:
    when: no usable bureau score for any income-contributing borrower
    status: not_built
    route: separate_model_or_manual    # mandatory_rules.bureau.no_score
  under_construction_housing:
    when: product home_loan and property not complete at sanction
    status: not_built
    route: HOLD
    prerequisites: [subscores.builder, controls.tranche_controls]
  proprietor_without_commercial_rank:
    when: borrower model BUS, sole proprietorship, no ENT_COMMERCIAL_RANK available
    status: not_built
    route: HOLD            # ENT_COMMERCIAL_RANK (5 points) would have no evidence
  entity_borrower:
    when: borrower is a company, LLP or partnership firm
    status: not_built
    route: HOLD

# ---------------------------------------------------------------- reason codes
# The factual reason recorded against a parameter or rule that produced a non-PASS
# action (decision_record.parameter_fields.reason_code). Shown to the customer on
# a decline and to the approver on a referral. {raw} is the observed value; format
# specifiers follow Python str.format. Never "low score" alone.
reason_codes:
  # scorecard parameters
  IND_BUREAU_SCORE:          "Bureau score {raw} is below the policy minimum of 675"
  IND_MAX_DPD_24M:           "A payment was {raw} days past due in the last 24 months"
  IND_EMPLOYMENT_STABILITY:  "Less than 6 months with the current employer"
  IND_EMPLOYER_ASSESSMENT:   "Employer assessment of {raw}/100 is below the automatic threshold of 70"
  IND_INCOME_CONTINUITY_12M: "Recurring income seen in only {raw} of the last 12 months"
  ENT_COMMERCIAL_RANK:       "Commercial bureau rank {raw} is worse than the policy limit of 7"
  ENT_BUSINESS_VINTAGE:      "The business has operated for {raw} years; the minimum is 2"
  ENT_INDUSTRY_RISK:         "Industry assessment of {raw}/100 places the business in the high-risk band"
  ENT_INDUSTRY_RISK_PROHIBITED: "The business activity is prohibited under lending policy"
  BNK_SALARY_CREDITS_6M:     "Salary was credited in only {raw} of the last 6 months"
  BNK_FINANCIAL_BOUNCES_12M: "{raw} payments bounced for insufficient funds in the last 12 months"
  BNK_WC_DISCIPLINE:         "The working-capital limit was exceeded without authorisation on {raw} days in the last 12 months"
  FIN_DSCR:                  "Debt service coverage of {raw:.2f} is below the policy minimum of 1.20"
  FIN_DEBT_TO_TNW:           "Debt is {raw:.1f} times tangible net worth; the policy limit is 4"
  FIN_DEBT_TO_TNW_NON_POSITIVE: "Tangible net worth is zero or negative"
  FIN_PROFITABILITY_3Y:      "The latest financial year shows a loss"
  FIN_REVENUE_CAGR_3Y:       "Revenue fell by {raw:.0%} a year over the last three years"
  FIN_ITR_RECONCILIATION:    "Income in tax returns differs from other evidence by {raw:.0%} without explanation"
  GST_ON_TIME_FILING_12M:    "Only {raw:.0%} of GST returns were filed on time in the last 12 months"
  GST_BANKING_VARIANCE:      "GST turnover and bank credits differ by {raw:.0%}"
  GST_TURNOVER_GROWTH_T12M:  "GST turnover fell by {raw:.0%} over the last 12 months"
  PRP_PROPERTY_TYPE:         "The property ({raw}) is not acceptable security for this product"
  PRP_MARKETABILITY:         "The property is expected to take {raw} months to sell; the limit is 18"
  PRP_REQUESTED_LTV:         "The requested loan is {raw:.0%} of the property value, above the product maximum"
  LEG_TITLE_MORTGAGE:        "Legal report: {raw}"
  LEG_APPROVALS_OWNERSHIP:   "Legal report on approvals and ownership: {raw}"
  TEC_PHYSICAL_CONDITION:    "Technical report rates the property condition as {raw}"
  TEC_VALUATION_VARIANCE:    "The two valuations differ by {raw:.0%}"
  TEC_RESIDUAL_LIFE:         "The property's remaining life ends {raw} years after the loan would"
  # mandatory rules and decision steps
  MR_AGE:                    "Age at loan maturity would exceed {limit} years"
  MR_ROI_TENURE:             "No standard offer exists inside 13-17% p.a. and 36-120 months"
  MR_BUREAU_NO_SCORE:        "No usable bureau score for an income-contributing borrower"
  MR_CAPACITY:               "Income does not support the EMI at the stressed rate of {stress_rate:.2f}% within 120 months"
  GRADE_D:                   "Application score of {raw:.0f}/100 is below 60; the main factors were {top_factors}"
  CATEGORY_FLOOR:            "The {category} assessment scored {raw:.0f}/100, below the floor of 60 for automatic approval"
  # guardrail rules use their own id (AML01, PRP07, ...) with the rule's `check` as the
  # default reason, completed by the owner's recorded resolution

# ---------------------------------------------------------------- consistency invariants
# Machine-checkable. A file that fails any of these must not be loaded.
invariants:
  INV-01: each model's parameter weights within a category sum to that category's weight, and the categories sum to 100
  INV-02: pricing.matrix[g][i] == pricing.grade_base_roi[g] + pricing.tenure_adjustment[i].add_pct
  INV-03: reference.card_rate_floor + risk_grade_loading_bps[g]/100 == pricing.grade_base_roi[g]
  INV-04: tenure_loading_bps[i].bps/100 == pricing.tenure_adjustment[i].add_pct, on the same month boundaries
  INV-05: every non-null matrix rate lies within [pricing.roi_floor, pricing.roi_ceiling] == [reference.card_rate_floor, reference.card_rate_ceiling]
  INV-06: subscore factor weights sum to 100 (employer, industry, builder)
  INV-07: every band list ends with an else catch-all, and ge-bands descend / le-bands ascend
  INV-08: every action or outcome word in the file appears in actions
  INV-09: every grade the risk model can emit (model_config.yaml risk.grade_cutoffs) has a risk_grade_loading_bps entry
  INV-10: every approval_authority level has max_premium_bps == 0 (the matrix rate is the ceiling)
  INV-11: constraints.max_tenure_years*12 == constraints.max_tenure_months == pricing.tenure_adjustment[-1].max_months

# ---------------------------------------------------------------- decisions on the draft's open items
# Taken 2026-11-18 to close the circulated draft's open items. They go to Risk with
# this draft for approval, like every other value in it.
decisions:
  D-01: Version renumbered HL-LAP-POLICY-2026.14 so it sorts after HL-POLICY-2026.13, which it replaces.
  D-02: Until the scorecard runs, grades come from annual-PD bands (grades.assignment).
  D-03: The matrix rate is the ceiling. No authority may approve a premium (max_premium_bps 0); an uplift only gives back part of a discount.
  D-04: 90+ DPD in 24 months, write-off or settlement, and HIS03 are outside_policy - no standard offer; the only route is a credit-head deviation recorded with override.record_fields.
  D-05: FIN_PROFITABILITY_3Y gains latest_positive_middle_loss (+ - +) at 60, between 80 and 40.
  D-06: Businesses with 2-3 years of financials are scored on the years available, at most 80; one year or less refers.
  D-07: BNK_WC_DISCIPLINE without a CC/OD facility scores a neutral 60, as IND_REVOLVING_UTIL_3M.
  D-08: PRP_PROPERTY_TYPE reads its own intake field, property_use; property_type stays the construction type.
  D-09: pricing.stress_test_add_pct is the one stress add-on; constraints.stress_rate_add_bps is removed.
