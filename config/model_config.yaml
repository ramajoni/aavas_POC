model_config_version: "MODEL-2026.09"
seed: 42

data:
  n_applications: 20000
  raw_path: data/raw/home_loan_data.csv
  notes_path: data/raw/sales_notes.csv
  processed_path: data/processed/training_data.csv
  test_size: 0.2
  # Time-based split: pricing is non-stationary, a random split flatters the model.
  split_strategy: time          # time | random
  time_column: application_date

registry:
  dir: models
  # Every artefact is written as <name>__<version>.joblib plus a model card JSON.
  version: "v1"

tracking:
  enabled: false                 # set true (and pip install mlflow) to log runs
  experiment: aavas-pricing-poc
  uri: file:./mlruns

stage1:
  learner: gradient_boosting_quantile
  params:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.05
    min_samples_leaf: 40
    subsample: 0.9
  # The band is a quantile interval; the median model powers the point anchor.
  quantiles: [0.10, 0.50, 0.90]

stage2:
  learner: auto                  # auto -> xgboost if installed, else hist_gradient_boosting
  params:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
  hist_params:
    max_iter: 400
    max_depth: 6
    learning_rate: 0.05
    min_samples_leaf: 30
    l2_regularization: 1.0
  tuning:
    enabled: false               # set true (and pip install optuna) for a search
    n_trials: 30

conversion:
  learner: hist_gradient_boosting_classifier
  params:
    max_iter: 300
    max_depth: 5
    learning_rate: 0.06
    min_samples_leaf: 40
    l2_regularization: 1.0
  calibration: isotonic          # probabilities feed money maths; calibrate them

prepayment:
  horizon_months: 24
  learner: hist_gradient_boosting_classifier
  params:
    max_iter: 250
    max_depth: 5
    learning_rate: 0.06
    min_samples_leaf: 40
  calibration: isotonic

override:
  learner: hist_gradient_boosting
  classifier_params:
    max_iter: 250
    max_depth: 5
    learning_rate: 0.06
    min_samples_leaf: 40
  regressor_params:
    max_iter: 250
    max_depth: 5
    learning_rate: 0.06
    min_samples_leaf: 40

risk:
  # PD model + policy LGD table. The model is fitted on a lifetime-to-date default
  # flag, so its output is a LIFETIME PD. Pricing needs an ANNUALISED expected
  # loss, and the grade cut-offs below are annual - hence pd_horizon_years, the
  # average observation window the default flag represents. Getting this unit
  # wrong silently inflates expected loss by ~4x and grades every file D/E.
  pd_horizon_years: 4.0
  learner: hist_gradient_boosting_classifier
  params:
    max_iter: 300
    max_depth: 5
    learning_rate: 0.06
    min_samples_leaf: 40
  lgd_by_property_type:
    resale_flat: 0.28
    builder_flat: 0.32
    self_construction: 0.40
    plot_plus_construction: 0.45
  grade_cutoffs:                 # PD upper bounds
    A: 0.010
    B: 0.025
    C: 0.050
    D: 0.090
    E: 1.000

xai:
  backend: auto                  # auto -> shap if installed, else ablation
  top_k_reason_codes: 5
  min_reason_code_bps: 2         # suppress noise below this magnitude

drift:
  psi_warn: 0.10
  psi_alert: 0.25
  performance_window: 500        # decisions
  min_samples_for_check: 200

champion_challenger:
  shadow_min_decisions: 300
  promote_if_better_by_pct: 2.0  # challenger must beat champion EV by this margin
  max_conversion_drop_pct: 1.0   # ...without dropping conversion more than this
  require_human_signoff: true
