# Online applications and the documents a borrower uploads with them.
#
# A borrower submits an application after seeing an indicative offer, then
# uploads documents against it. Relationship managers see every submitted
# application and its documents; a borrower sees only their own.
intake_config_version: INTAKE-2026.10

# What the borrower is asked for. The key is stored; the label is shown.
document_types:
  income_proof: "Income proof (last 3 salary slips)"
  bank_statement: "Bank statement (last 6 months)"
  identity_address: "Identity and address proof (PAN, Aadhaar)"
  property_papers: "Property documents (sale agreement, title)"
  other: "Other supporting document"

# How a nudge or a worklist names a document that is still due.
document_short_names:
  income_proof: "salary slips"
  bank_statement: "bank statement"
  identity_address: "PAN and Aadhaar"
  property_papers: "property papers"

# Checked against the file's contents, not the name or the browser's claim.
allowed_formats: [pdf, jpeg, png]
max_file_mb: 10
max_documents_per_application: 20

# A file is verified - ready for a final offer - once these are in. Until then it
# sits in the RM's "In progress" list with what is still due.
required_for_verification: [income_proof, bank_statement, identity_address]

# What the relationship manager fills in, in order, before a file is priced and
# sent, named in the words an RM uses. Each step unlocks the next: the indicative
# range needs the customer's own figures; computing the loan risk (and so the
# risk-adjusted rate) needs every verified figure and both checks; the acceptance
# rate needs the customer interaction and negotiation. `action` is the button. Nothing goes to the
# customer or the area manager until all three are complete. Read by
# src/aavas/intake/readiness.py, which adds the sense checks (loan to value,
# limits, flagged checks) from the pricing policy. A competitor's quote is
# optional: recorded when the customer has one, never required.
readiness:
  - key: indicative
    label: "Indicative pricing"
    unlocks: "the indicative range"
    action: "Fill in the customer's details"
    fields:
      name: "Name"
      mobile: "Mobile"
      segment: "Employment"
      city: "City"
      channel: "Source"
      property_type: "Property type"
      applicant_age: "Age"
      declared_monthly_income: "Declared monthly income"
      declared_obligations: "Monthly obligations (0 if none)"
      requested_loan_amount: "Requested loan"
      requested_tenure_years: "Requested tenure"
      estimated_property_value: "Estimated property value"
      bureau_score: "Credit score (or new to credit)"
  - key: risk
    label: "Compute loan risk"
    unlocks: "the risk-adjusted rate"
    action: "Enter the verified figures"
    fields:
      verified_monthly_income: "Verified monthly income"
      appraised_property_value: "Appraised property value"
      sanctioned_loan_amount: "Assessed loan amount"
      tenure_years: "Assessed tenure"
      bureau_vintage_months: "Credit history (months)"
      banking_behaviour_score: "Banking behaviour"
      delinquency_count_24m: "Delinquencies, last 24 months"
      deviation_count: "Credit deviations"
      legal_flag: "Legal check"
      technical_flag: "Technical check"
  - key: behaviour
    label: "Customer interaction and negotiation"
    unlocks: "the acceptance rate and sending"
    action: "Record the customer interaction"
    fields:
      customer_negotiating: "Is the customer negotiating?"
      prior_negotiation_rounds: "Negotiation rounds so far"
      existing_relationship: "Existing Aavas customer?"
      conversation_notes: "Notes from the conversation"

# The RM's "In progress" list: files that have not reached verification, listed
# from the store. Sample leads (quotes never applied for, customers who stopped
# part-way) may be listed here to stand in for the rest of a real pipeline; they
# are marked as samples on screen. None by the user's choice (2026-10-28): the RM
# sees only real files.
sample_in_progress: []

# What a nudge says, by where the customer stopped. Recorded against the file;
# delivery needs an SMS or WhatsApp gateway, which this service does not have.
nudge_channels: [whatsapp, sms]
nudge_messages:
  documents_pending: "Hi {first}, your Aavas home loan application is waiting for {missing}. Upload them from your Aavas login, or reply here and I will collect them. - {rm}, Aavas"
  quote_not_applied: "Hi {first}, the home loan rate we quoted you ({quoted}) is still open. Applying takes five minutes from your Aavas login, or reply here and I will help. - {rm}, Aavas"
  dropped_off: "Hi {first}, you were nearly done with your Aavas home loan application. Pick up where you left off, or reply here and I will call you. - {rm}, Aavas"
